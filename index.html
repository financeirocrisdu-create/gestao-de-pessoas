<body>
<script>
const APP_CONFIG = {
  VERSION: '5.0.0',
  DEFAULT_API_URL: "https://script.google.com/macros/s/AKfycbzXEFTcaUYvYhs8E1m6VRUUUire4VwxB12wQQ3-CYho8mtn7jWMBWduFWTHZK5PVeJv/exec",
  API_STORAGE_KEY: 'crisdu_api_url_v5',
  TOKEN_KEY: 'crisdu_api_token_v5',
  POLL_MS: 7000
};

const STATIC_USERS = {
  debora:{role:'rh',name:'Débora',initials:'DE',title:'Gerência',team:'Todos os setores',manager:''},
  bruna:{role:'gestor',name:'Bruna',initials:'BR',title:'Coordenação · Tesouraria e Contas a Pagar',team:'Tesouraria e Contas a Pagar',manager:''},
  carolini:{role:'gestor',name:'Carolini',initials:'CA',title:'Coordenação de Contas a Receber',team:'Contas a Receber',manager:''},
  neidi:{role:'gestor',name:'Neidi Becker',initials:'NE',title:'Coordenação · Financeiro Romance',team:'Financeiro Romance',manager:''},
  leticia:{role:'colab',name:'Letícia',initials:'LM',title:'Analista de Tesouraria',team:'Tesouraria',manager:'bruna'},
  franciele:{role:'colab',name:'Franciele',initials:'FP',title:'Analista de Tesouraria',team:'Tesouraria',manager:'bruna'},
  estefani:{role:'colab',name:'Estéfani',initials:'EO',title:'Assistente Pleno · Contas a Pagar',team:'Contas a Pagar',manager:'bruna'},
  nadia:{role:'colab',name:'Nádia de Vargas Beck',initials:'NB',title:'Especialista Financeira',team:'Tesouraria',manager:'bruna'}
};

const TEAM_MAP = {bruna:['leticia','franciele','estefani','nadia'],carolini:[],neidi:[]};

const state = {
  session:null, users:{...STATIC_USERS}, tasks:[], requests:[], feedbacks:[], pdis:[], events:[], notifications:[], audit:[],
  version:0, page:'dashboard', taskView:'table', taskFilter:'all', search:'', poll:null, syncing:false, serverState:'idle'
};

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const uid = () => 'id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);
const nowIso = () => new Date().toISOString();
const fmtDate = v => !v ? '—' : new Date(v.length===10?v+'T12:00:00':v).toLocaleDateString('pt-BR');
const fmtDateTime = v => !v ? '—' : new Date(v).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
const clamp = (n,a,b)=>Math.min(b,Math.max(a,Number(n)||0));

function apiUrl(){ return localStorage.getItem(APP_CONFIG.API_STORAGE_KEY)||APP_CONFIG.DEFAULT_API_URL; }
function token(){ return sessionStorage.getItem(APP_CONFIG.TOKEN_KEY)||''; }

function toast(msg,type='') {
  const z = $('#toast-zone'); if(!z) return;
  const el=document.createElement('div'); el.className='toast '+type; el.textContent=msg; z.appendChild(el);
  setTimeout(()=>el.remove(),4200);
}

function setServerState(kind,text) {
  state.serverState=kind;
  const el=$('#sync-pill'); if(!el)return;
  el.className='sync-pill '+kind;
  el.innerHTML=`<span class="status-dot ${kind==='online'?'online':kind==='error'?'error':''}"></span><span class="label">${esc(text||'Servidor')}</span>`;
}

async function api(action,data={},silent=false) {
  if(state.syncing && action==='changes') return null;
  if(!silent)setServerState('syncing','Sincronizando…');
  const controller=new AbortController(); const t=setTimeout(()=>controller.abort(),25000);
  try {
    const r=await fetch(apiUrl(),{method:'POST',redirect:'follow',cache:'no-store',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:token(),...data}),signal:controller.signal});
    const raw=await r.text(); let j;
    try{j=JSON.parse(raw)}catch(e){throw new Error('Servidor respondeu em formato inválido. Publique o Apps Script como Web App e use a URL /exec.');}
    if(!j.ok) throw new Error(j.error||j.erro||'Erro no servidor.');
    setServerState('online','Servidor online'); return j;
  } catch(e) {
    if(e.name==='AbortError') e=new Error('Tempo de resposta do servidor excedido.');
    setServerState('error','Falha no servidor');
    if(!silent)toast(e.message,'err');
    throw e;
  } finally { clearTimeout(t); }
}

async function testServer() {
  const err=$('#login-error'); if(err)err.textContent='';
  try {
    const j=await api('health',{},true);
    setServerState('online',j.backend||'Servidor online');
    toast('Servidor conectado.','ok');
    return true;
  } catch(e) {
    if(err)err.textContent=e.message;
    return false;
  }
}

function avatar(key,lg=false){ const u=user(key); return `<span class="avatar ${lg?'lg':''}">${esc(u.initials||u.name.slice(0,2).toUpperCase())}</span>`; }
function visibleKeys() {
  if(currentRole()==='rh') return Object.keys(state.users);
  if(currentRole()==='gestor') return [currentUser(),...(TEAM_MAP[currentUser()]||[]),...Object.keys(state.users).filter(k=>state.users[k].manager===currentUser())].filter((v,i,a)=>a.indexOf(v)===i);
  return [currentUser()];
}
function teamKeys(){ return currentRole()==='rh'?Object.keys(state.users).filter(k=>state.users[k].role==='colab'):visibleKeys().filter(k=>k!==currentUser()&&state.users[k]?.role==='colab'); }
function canSeeOwner(owner){ return visibleKeys().includes(owner); }

function statusClass(s){ return {'Não iniciada':'todo','Em andamento':'progress','Aguardando':'wait','Concluída':'done','Bloqueada':'blocked'}[s]||'todo'; }
function priorityClass(p){ return {'Alta':'high','Média':'medium','Baixa':'low'}[p]||'low'; }
function isOverdue(t){ return t.status!=='Concluída'&&t.dueDate&&new Date(t.dueDate+'T23:59:59')<new Date(); }
function dueSoon(t){ if(!t.dueDate||t.status==='Concluída')return false; const d=(new Date(t.dueDate+'T23:59:59')-new Date())/86400000; return d>=0&&d<=3; }

function renderStatusBars(tasks) {
  const statuses=['Não iniciada','Em andamento','Aguardando','Bloqueada','Concluída'];

function renderTeamSummary(keys) {
  if(!keys.length)return `<div class="empty"><div class="big">👥</div>Nenhum colaborador vinculado a esta gestão.</div>`;
  return keys.map(k=>{const ts=state.tasks.filter(t=>t.owner===k), open=ts.filter(t=>t.status!=='Concluída'), ov=open.filter(isOverdue).length, bl=open.filter(t=>t.status==='Bloqueada').length; const avg=ts.length?Math.round(ts.reduce((a,t)=>a+pct(t),0)/ts.length):0; return `<div class="team-row"><div class="person">${avatar(k)}<div><b>${esc(user(k).name)}</b><span>${esc(user(k).title||user(k).team)}</span></div></div><div><div class="small muted">${open.length} abertas · ${ov} vencidas · ${bl} bloqueadas</div><div class="mini-progress"><i style="width:${avg}%"></i></div></div><div class="team-metric"><b>${avg}%</b><span class="muted">avanço</span></div></div>`}).join('');

function renderFeed(events) {

function renderAlerts(d) {
  const arr=[];

function renderUpcoming(tasks) {

  const r=state.requests.find(x=>x.id===id)||{id:'',type:'Geral',title:'',description:'',requester:currentUser(),recipient:isLeader()?(currentUser()):(user(currentUser()).manager||'bruna'),status:'Não iniciada',priority:'Média'};
  const recipients=Object.keys(state.users).filter(k=>k!==currentUser());
  showModal('Solicitação',`<div class="row"><div class="field"><label>Tipo</label><input id="r-type" value="${esc(r.type||'Geral')}"></div><div class="field"><label>Destinatário</label><select id="r-rec">${recipients.map(k=>`<option value="${k}" ${r.recipient===k?'selected':''}>${esc(user(k).name)}</option>`).join('')}</select></div></div><div class="field"><label>Título *</label><input id="r-title" value="${esc(r.title)}"></div><div class="field"><label>Descrição</label><textarea id="r-desc">${esc(r.description||'')}</textarea></div><div class="row"><div class="field"><label>Status</label><select id="r-status">${['Não iniciada','Em andamento','Aguardando','Concluída','Bloqueada'].map(s=>`<option ${r.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Prioridade</label><select id="r-pri">${['Baixa','Média','Alta'].map(s=>`<option ${r.priority===s?'selected':''}>${s}</option>`).join('')}</select></div></div>`,
  `<button class="btn btn-outline" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveRequest('${r.id}')">Salvar</button>`);
}
async function saveRequest(id='') {
  const old=state.requests.find(x=>x.id===id); const title=$('#r-title').value.trim(); if(!title)return toast('Informe o título.','err');
  const req={id:id||uid(),type:$('#r-type').value.trim(),title,description:$('#r-desc').value.trim(),requester:old?.requester||currentUser(),recipient:$('#r-rec').value,status:$('#r-status').value,priority:$('#r-pri').value,createdAt:old?.createdAt||nowIso(),updatedAt:nowIso()};
  try{const j=await api('saveRequest',{request:req});applySnapshot(j.snapshot);closeModal();toast('Solicitação salva e notificada.','ok');renderPage();}catch(e){}
}

function renderFeedbacks() {
  $('#top-title').textContent='Feedbacks & PDI'; $('#top-sub').textContent='Desenvolvimento e acompanhamento';
  const fb=state.feedbacks.filter(x=>currentRole()==='rh'||x.employee===currentUser()||x.manager===currentUser()||canSeeOwner(x.employee));
  const pd=state.pdis.filter(x=>currentRole()==='rh'||x.employee===currentUser()||x.manager===currentUser()||canSeeOwner(x.employee));
  $('#page').innerHTML=pageHead('Feedbacks & PDI','Registros de desenvolvimento vinculados ao colaborador e à gestão.',isLeader()?`<div style="display:flex;gap:8px"><button class="btn btn-outline" onclick="openFeedbackModal()">+ Feedback</button><button class="btn btn-primary" onclick="openPdiModal()">+ PDI</button></div>`:'')+
  `<div class="grid two"><div class="card"><div class="card-head"><div><h3>Feedbacks</h3><span>${fb.length} registros</span></div></div><div class="card-pad">${fb.length?fb.map(x=>`<div class="alert"><b>${esc(user(x.employee).name)} · ${esc(x.kind||'Feedback')}</b><p>${esc(x.summary||'')}</p><div class="feed-time">${fmtDateTime(x.updatedAt)}</div></div>`).join(''):`<div class="empty">Sem feedbacks.</div>`}</div></div>
  <div class="card"><div class="card-head"><div><h3>Planos de desenvolvimento</h3><span>${pd.length} registros</span></div></div><div class="card-pad">${pd.length?pd.map(x=>`<div class="alert"><b>${esc(user(x.employee).name)} · ${esc(x.goal||'PDI')}</b><p>${esc(x.actions||'')}</p><div class="feed-time">Status: ${esc(x.status||'Em andamento')} · ${fmtDate(x.dueDate)}</div></div>`).join(''):`<div class="empty">Sem PDIs.</div>`}</div></div></div>`;
}
function employeeOptions(selected=''){return (currentRole()==='rh'?Object.keys(state.users).filter(k=>state.users[k].role==='colab'):teamKeys()).map(k=>`<option value="${k}" ${selected===k?'selected':''}>${esc(user(k).name)}</option>`).join('')}
function openFeedbackModal(){
  showModal('Novo feedback',`<div class="row"><div class="field"><label>Colaborador</label><select id="f-emp">${employeeOptions()}</select></div><div class="field"><label>Tipo</label><select id="f-kind"><option>Feedback 1:1</option><option>Reconhecimento</option><option>Ponto de melhoria</option><option>Alinhamento</option></select></div></div><div class="field"><label>Resumo</label><textarea id="f-summary"></textarea></div>`,
  `<button class="btn btn-outline" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="saveFeedback()">Salvar</button>`);
}
async function saveFeedback(){
  const x={id:uid(),employee:$('#f-emp').value,manager:currentUser(),kind:$('#f-kind').value,summary:$('#f-summary').value.trim(),createdAt:nowIso(),updatedAt:nowIso()};
  try{const j=await api('saveFeedback',{feedback:x});applySnapshot(j.snapshot);closeModal();toast('Feedback registrado.','ok');renderPage();}catch(e){}
}
function openPdiModal(){
  showModal('Novo PDI',`<div class="field"><label>Colaborador</label><select id="p-emp">${employeeOptions()}</select></div><div class="field"><label>Objetivo de desenvolvimento</label><input id="p-goal"></div><div class="field"><label>Ações</label><textarea id="p-actions"></textarea></div><div class="row"><div class="field"><label>Prazo</label><input id="p-due" type="date"></div><div class="field"><label>Status</label><select id="p-status"><option>Em andamento</option><option>Aguardando</option><option>Concluída</option></select></div></div>`,
  `<button class="btn btn-outline" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="savePdi()">Salvar</button>`);
}
async function savePdi(){
  const x={id:uid(),employee:$('#p-emp').value,manager:currentUser(),goal:$('#p-goal').value.trim(),actions:$('#p-actions').value.trim(),dueDate:$('#p-due').value,status:$('#p-status').value,createdAt:nowIso(),updatedAt:nowIso()};
  try{const j=await api('savePdi',{pdi:x});applySnapshot(j.snapshot);closeModal();toast('PDI registrado.','ok');renderPage();}catch(e){}
}

function renderPeople() {
  $('#top-title').textContent='Pessoas'; $('#top-sub').textContent='Usuários, perfis e acessos';
  const keys=Object.keys(state.users);
  $('#page').innerHTML=pageHead('Pessoas','Cadastros de usuários e vínculo com a gestão.',`<button class="btn btn-primary" onclick="openUserModal()">+ Novo usuário</button>`)+
  `<div class="user-grid">${keys.map(k=>`<div class="user-card"><div class="user-card-top">${avatar(k,true)}<div><h4>${esc(user(k).name)}</h4><p>${esc(user(k).title||user(k).role)}</p></div></div><div class="meta"><div class="meta-box"><b>${esc(user(k).role)}</b><span>Perfil</span></div><div class="meta-box"><b>${esc(user(user(k).manager).name||'—')}</b><span>Gestor</span></div></div><button class="btn btn-soft btn-sm" style="width:100%;margin-top:12px" onclick="resetUserPassword('${k}')">Redefinir senha</button></div>`).join('')}</div>`;
}
function openUserModal() {
  const managers=Object.keys(state.users).filter(k=>state.users[k].role==='gestor');
  showModal('Novo usuário',`<div class="row"><div class="field"><label>Nome *</label><input id="u-name"></div><div class="field"><label>Login *</label><input id="u-login" placeholder="nome.sobrenome"></div></div><div class="row"><div class="field"><label>Perfil</label><select id="u-role"><option value="colab">Colaborador</option><option value="gestor">Gestor</option><option value="rh">RH</option></select></div><div class="field"><label>Gestor</label><select id="u-manager"><option value="">Sem gestor</option>${managers.map(k=>`<option value="${k}">${esc(user(k).name)}</option>`).join('')}</select></div></div><div class="row"><div class="field"><label>Cargo</label><input id="u-title"></div><div class="field"><label>Equipe / setor</label><input id="u-team"></div></div><div class="small muted">O servidor criará uma senha temporária forte e exigirá troca no primeiro acesso.</div>`,
  `<button class="btn btn-outline" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="createUser()">Criar usuário</button>`);
}
async function createUser() {
  const name=$('#u-name').value.trim(),login=$('#u-login').value.trim().toLowerCase(); if(!name||!login)return toast('Informe nome e login.','err');
  try{const j=await api('createUser',{user:{name,login,role:$('#u-role').value,manager:$('#u-manager').value,title:$('#u-title').value.trim(),team:$('#u-team').value.trim()}});applySnapshot(j.snapshot);closeModal();showSecret('Usuário criado',`Login: ${j.credentials.login}\nSenha temporária: ${j.credentials.password}\n\nEnvie por canal seguro. A troca será obrigatória no primeiro acesso.`);renderPage();}catch(e){}
}
async function resetUserPassword(key) {
  if(!confirm('Gerar nova senha temporária para '+user(key).name+'?'))return;
  try{const j=await api('resetUserPassword',{userKey:key});showSecret('Senha redefinida',`Login: ${j.credentials.login}\nSenha temporária: ${j.credentials.password}`);}catch(e){}
}

function renderAudit() {
  $('#top-title').textContent='Auditoria'; $('#top-sub').textContent='Rastreabilidade das movimentações';
  const rows=state.audit.slice(0,300);
  $('#page').innerHTML=pageHead('Auditoria','Histórico técnico de gravações, alterações e acessos.')+`<div class="card"><div style="overflow:auto"><table class="audit-table"><thead><tr><th>Data/hora</th><th>Usuário</th><th>Ação</th><th>Detalhe</th><th>Versão</th></tr></thead><tbody>${rows.map(a=>`<tr><td>${fmtDateTime(a.createdAt||a.date)}</td><td>${esc(user(a.user).name||a.user)}</td><td>${esc(a.action)}</td><td>${esc(a.detail)}</td><td>${esc(a.version||'')}</td></tr>`).join('')}</tbody></table></div></div>`;
}

function renderSettings() {
  $('#top-title').textContent='Configurações'; $('#top-sub').textContent='Servidor e segurança';
  $('#page').innerHTML=pageHead('Configurações','Conexão com o Apps Script e manutenção da conta.')+
  `<div class="grid two"><div class="card"><div class="card-head"><div><h3>Servidor</h3><span>Google Apps Script Web App</span></div></div><div class="card-pad"><div class="field"><label>URL /exec</label><input id="cfg-url" value="${esc(apiUrl())}"></div><div style="display:flex;gap:8px"><button class="btn btn-primary" onclick="saveApiUrl()">Salvar e testar</button><button class="btn btn-outline" onclick="pollNow(true)">Sincronizar agora</button></div><p class="small muted">A URL fica apenas neste navegador. Para todos os usuários, mantenha o DEFAULT_API_URL no app.js.</p></div></div>
  <div class="card"><div class="card-head"><div><h3>Segurança</h3><span>Sessão e senha</span></div></div><div class="card-pad"><button class="btn btn-outline" onclick="openChangePassword()">Alterar minha senha</button><p class="small muted">As senhas ficam somente no servidor, armazenadas como hash com salt. O HTML não contém senhas.</p></div></div></div>`;
}
async function saveApiUrl() {
  const v=$('#cfg-url').value.trim(); if(!/\/exec(?:\?.*)?$/.test(v))return toast('Informe a URL do Web App terminada em /exec.','err');
  localStorage.setItem(APP_CONFIG.API_STORAGE_KEY,v); await testServer(); await pollNow(true);
}

function renderPage() {
  if(!state.session)return;
  if(state.page==='dashboard')renderDashboard();
  else if(state.page==='tasks')renderTasks();
  else if(state.page==='team')renderTeam();
  else if(state.page==='requests')renderRequests();
  else if(state.page==='feedbacks')renderFeedbacks();
  else if(state.page==='people')renderPeople();
  else if(state.page==='audit')renderAudit();
  else renderSettings();
}

function updateNotifBadge() {
  const n=state.notifications.filter(x=>!x.read).length,el=$('#notif-count'); if(!el)return; el.textContent=n>99?'99+':n; el.classList.toggle('hidden',!n);
}
function toggleNotifications() {
  let d=$('#notif-drawer');
  if(d.innerHTML){d.innerHTML='';return;}
  const rows=state.notifications.slice(0,80);
  d.innerHTML=`<div class="notif-drawer"><div class="notif-head"><b>Notificações</b><button class="link-btn" onclick="markNotificationsRead()">Marcar todas como lidas</button></div>${rows.length?rows.map(n=>`<div class="notif-item ${n.read?'':'unread'}"><span class="notif-bullet"></span><div><b>${esc(n.title)}</b><p>${esc(n.message)}</p><time>${fmtDateTime(n.createdAt)}</time></div></div>`).join(''):`<div class="empty">Sem notificações.</div>`}</div>`;
}
async function markNotificationsRead() {
  try{const j=await api('markNotificationsRead',{},true);applySnapshot(j.snapshot);$('#notif-drawer').innerHTML='';updateNotifBadge();}catch(e){}
}

function showModal(title,body,foot='',wide=false) {
  $('#modal-root').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal ${wide?'wide':''}"><div class="modal-head"><h3>${esc(title)}</h3><button class="modal-close" onclick="closeModal()">×</button></div><div class="modal-body">${body}</div><div class="modal-foot">${foot}</div></div></div>`;
}
function closeModal(){ const r=$('#modal-root'); if(r)r.innerHTML=''; }
function showSecret(title,text){showModal(title,`<div class="field"><label>Credencial temporária</label><textarea class="mono" id="secret-text" readonly>${esc(text)}</textarea></div><div class="small muted">Não publique esta senha no GitHub.</div>`,`<button class="btn btn-outline" onclick="navigator.clipboard.writeText($('#secret-text').value);toast('Copiado.','ok')">Copiar</button><button class="btn btn-primary" onclick="closeModal()">Fechar</button>`)}

function openChangePassword(force=false) {
  showModal(force?'Defina uma nova senha':'Alterar senha',`<div class="field"><label>Nova senha</label><input id="cp1" type="password" placeholder="Mínimo 10 caracteres"></div><div class="field"><label>Confirmar</label><input id="cp2" type="password"></div><div class="small muted">Use letras maiúsculas, minúsculas, número e caractere especial.</div>`,
  `<button class="btn btn-primary" onclick="changePassword(${force?'true':'false'})">Salvar nova senha</button>`);
}
async function changePassword(force=false) {
  const a=$('#cp1').value,b=$('#cp2').value;if(a!==b)return toast('As senhas não conferem.','err');if(a.length<10)return toast('Use pelo menos 10 caracteres.','err');
  try{const j=await api('changePassword',{password:a});state.session.forceReset=false;closeModal();toast('Senha alterada.','ok');}catch(e){}
}

async function login() {
  const username=$('#login-user').value.trim(),password=$('#login-pass').value; const err=$('#login-error'); err.textContent='';
  if(!username||!password){err.textContent='Informe usuário e senha.';return;}
  try {
    const j=await api('login',{username,password},true);
    sessionStorage.setItem(APP_CONFIG.TOKEN_KEY,j.token);
    state.session={userKey:j.userKey,role:j.role,forceReset:!!j.forceReset};
    await bootstrap();
    renderShell();
    if(j.forceReset)setTimeout(()=>openChangePassword(true),250);
  } catch(e) { err.textContent=e.message; }
}
async function bootstrap() {
  const j=await api('bootstrap',{},true); applySnapshot(j.snapshot); state.session={...state.session,...j.session};
}
function logout() {
  const tk=token(); sessionStorage.removeItem(APP_CONFIG.TOKEN_KEY); state.session=null; if(state.poll)clearInterval(state.poll);
  if(tk)api('logout',{},true).catch(()=>{});
  renderLogin();
}
function renderLogin() {
  document.body.innerHTML=`<div id="app"><div class="login-page"><section class="login-hero">
    <div class="brand-lockup">
      <div class="brand-title" style="font-size:44px;margin-top:0">Gestão de Pessoas</div>
      <div style="font-size:22px;font-weight:800;margin-top:10px">Financeiro Central</div>
      <div style="width:108px;height:5px;background:#fff;border-radius:999px;margin:36px 0 38px"></div>
      <div style="font-size:31px;line-height:1.18;font-weight:600;max-width:560px">
        Grandes conquistas nascem do<br>
        <strong style="display:inline-block;margin-top:10px;font-size:40px;line-height:1.05">trabalho em equipe</strong>
      </div>
    </div>
    <div class="crisdu-login-logo" style="font-size:30px;font-weight:950;line-height:.9;letter-spacing:-1px">
      GRUPO<br>CRISDU
    </div>
  </section>
  <section class="login-side"><div class="login-card"><div class="login-logo"><div class="logo-mark">RH</div><div><b>Gestão de Pessoas</b><div class="small muted">Financeiro Central · V5 Integrado</div></div></div><h1>Bem-vindo(a)</h1><p class="lead">Acesse sua conta para continuar.</p><div class="field"><label>Usuário</label><input id="login-user" autocomplete="username" placeholder="Ex.: leticia.medeiros"></div><div class="field"><label>Senha</label><input id="login-pass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"></div><div id="login-error" class="login-error"></div><div class="login-actions"><button class="btn btn-primary" onclick="login()">Entrar</button></div><div class="server-line"><div class="small"><span class="status-dot" id="login-dot"></span><span id="login-server">Servidor</span></div><button class="btn btn-outline btn-sm" onclick="testServerLogin()">Testar conexão</button></div></div></section></div><div class="toast-zone" id="toast-zone"></div></div>`;
  setTimeout(testServerLogin,250);
}
async function testServerLogin() {
  const dot=$('#login-dot'),txt=$('#login-server'); try{const j=await api('health',{},true);if(dot)dot.className='status-dot online';if(txt)txt.textContent=(j.backend||'Servidor online');}catch(e){if(dot)dot.className='status-dot error';if(txt)txt.textContent='Servidor indisponível';}
}

function applySnapshot(s) {
  if(!s)return;
  const oldUnread=new Set(state.notifications.filter(n=>!n.read).map(n=>n.id));
  if(s.users){state.users={...STATIC_USERS,...s.users};}
  state.tasks=s.tasks||[]; state.requests=s.requests||[]; state.feedbacks=s.feedbacks||[]; state.pdis=s.pdis||[]; state.events=(s.events||[]).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));
  state.notifications=(s.notifications||[]).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt))); state.audit=(s.audit||[]).sort((a,b)=>String(b.createdAt||b.date).localeCompare(String(a.createdAt||a.date)));
  state.version=Number(s.version||state.version||0);
  const fresh=state.notifications.filter(n=>!n.read&&!oldUnread.has(n.id));
  if(fresh.length&&oldUnread.size)toast(fresh[0].title+': '+fresh[0].message);
  updateNotifBadge();
}
async function pollNow(force=false) {
  if(!state.session||state.syncing)return;
  state.syncing=true;
  try{const j=await api('changes',{version:force?0:state.version},true);if(j&&j.changed&&j.snapshot){applySnapshot(j.snapshot);renderPage();}}catch(e){}finally{state.syncing=false;}
}
function startPolling() {
  if(state.poll)clearInterval(state.poll);
  state.poll=setInterval(()=>pollNow(false),APP_CONFIG.POLL_MS);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)pollNow(false)});
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();const d=$('#notif-drawer');if(d)d.innerHTML='';}});

renderLogin();

</script>
</body>
</html>
