<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#0B4F8A">
<title>Gestão de Pessoas · Financeiro Central</title>
<style>
:root{
  --navy:#073B66;--blue:#0B4F8A;--blue2:#1769A6;--sky:#EAF3FB;--sky2:#F4F8FC;
  --ink:#183042;--muted:#667788;--line:#D9E4ED;--bg:#EEF3F7;--card:#FFFFFF;
  --green:#15803D;--green-bg:#ECFDF3;--amber:#B45309;--amber-bg:#FFF7E8;
  --red:#B42318;--red-bg:#FFF0EE;--violet:#6D28D9;--violet-bg:#F3EEFF;
  --shadow:0 10px 35px rgba(15,55,85,.10);--shadow-sm:0 4px 15px rgba(15,55,85,.08);
  --r:18px;--r2:12px;--sidebar:252px;--top:68px;
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
body{overflow:hidden}button,input,select,textarea{font:inherit}button{cursor:pointer}
.hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:12px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
#app{height:100vh}.login-page{height:100vh;display:grid;grid-template-columns:1.05fr .95fr;background:#fff}
.login-hero{position:relative;overflow:hidden;background:linear-gradient(145deg,#062E50,#0B4F8A 58%,#1769A6);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:center}
.login-hero .brand-lockup{transform:translateY(-2%);max-width:620px}
.login-hero .crisdu-login-logo{position:absolute;left:56px;bottom:56px;z-index:2}
.login-hero:before,.login-hero:after{content:"";position:absolute;border-radius:999px;background:rgba(255,255,255,.08)}
.login-hero:before{width:520px;height:520px;right:-210px;top:-170px}.login-hero:after{width:380px;height:380px;left:-180px;bottom:-160px}
.brand-lockup{position:relative;z-index:1}.brand-kicker{font-size:13px;text-transform:uppercase;letter-spacing:.18em;opacity:.75;font-weight:800}
.brand-title{font-size:48px;line-height:1.05;font-weight:850;letter-spacing:-1.8px;margin-top:14px;max-width:600px}
.brand-copy{font-size:16px;line-height:1.65;opacity:.86;max-width:580px;margin-top:20px}
.hero-points{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.hero-point{border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);backdrop-filter:blur(6px);border-radius:16px;padding:16px}
.hero-point b{display:block;font-size:14px;margin-bottom:5px}.hero-point span{font-size:12px;opacity:.75}
.login-side{display:flex;align-items:center;justify-content:center;padding:42px}.login-card{width:min(460px,100%);background:#fff}
.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:34px}.logo-mark{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,var(--blue),#1D6FA8);display:grid;place-items:center;color:#fff;font-weight:900;box-shadow:var(--shadow-sm)}
.login-card h1{font-size:28px;margin:0 0 7px;letter-spacing:-.7px}.login-card .lead{margin:0 0 26px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:15px}.field label{font-size:12px;font-weight:800;color:#3E5364}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:12px;padding:12px 13px;background:#fff;color:var(--ink);outline:none;transition:.18s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#7DB4DB;box-shadow:0 0 0 4px rgba(23,105,166,.10)}.field textarea{min-height:94px;resize:vertical}
.row{display:flex;gap:12px}.row>*{flex:1}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.18s}
.btn-primary{background:linear-gradient(145deg,var(--blue),var(--blue2));color:#fff;box-shadow:0 7px 18px rgba(11,79,138,.18)}.btn-primary:hover{transform:translateY(-1px)}
.btn-soft{background:var(--sky);color:var(--blue)}.btn-outline{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn-danger{background:var(--red-bg);color:var(--red)}.btn-sm{padding:7px 10px;border-radius:9px;font-size:12px}
.login-actions{display:flex;gap:10px;margin-top:18px}.login-actions .btn-primary{flex:1}
.login-error{min-height:20px;color:var(--red);font-size:12px;margin-top:8px}.server-line{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.status-dot{width:9px;height:9px;border-radius:50%;background:#94A3B8;display:inline-block;margin-right:6px}.status-dot.online{background:#22C55E;box-shadow:0 0 0 5px rgba(34,197,94,.11)}.status-dot.error{background:#EF4444}
.shell{height:100vh;display:grid;grid-template-columns:var(--sidebar) 1fr;grid-template-rows:var(--top) 1fr}
.sidebar{grid-row:1/3;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;z-index:20}
.side-brand{display:flex;align-items:center;gap:11px;padding:3px 8px 20px}.side-brand .logo-mark{width:38px;height:38px;border-radius:12px}.side-brand b{display:block}.side-brand span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.nav{display:flex;flex-direction:column;gap:5px}.nav button{border:0;background:transparent;border-radius:11px;padding:11px 12px;text-align:left;color:#4E6170;font-weight:750;display:flex;gap:11px;align-items:center}
.nav button:hover{background:var(--sky2);color:var(--blue)}.nav button.active{background:var(--sky);color:var(--blue)}.nav-ico{width:20px;text-align:center}
.side-footer{margin-top:auto;border-top:1px solid var(--line);padding-top:14px}.mini-user{display:flex;align-items:center;gap:10px;padding:8px}.avatar{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:900;background:var(--sky);color:var(--blue);flex:0 0 auto}.avatar.lg{width:46px;height:46px;border-radius:14px}.mini-user b{display:block;font-size:12px}.mini-user span{display:block;font-size:10px;color:var(--muted);margin-top:2px}
.topbar{grid-column:2;display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:0 24px;z-index:18}
.top-title{font-weight:850;font-size:16px}.top-sub{font-size:11px;color:var(--muted);margin-top:2px}.top-spacer{margin-left:auto}
.sync-pill{border:1px solid var(--line);background:#fff;padding:7px 10px;border-radius:999px;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}.sync-pill.online{color:var(--green);background:var(--green-bg);border-color:#B7E4C7}.sync-pill.syncing{color:var(--amber);background:var(--amber-bg)}.sync-pill.error{color:var(--red);background:var(--red-bg)}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:#fff;color:#526474;display:grid;place-items:center;position:relative}.badge-count{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:999px;background:#E5484D;color:#fff;font-size:10px;font-weight:900;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}
.main{grid-column:2;grid-row:2;overflow:auto;padding:24px}.page{max-width:1500px;margin:0 auto}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}.page-head h2{margin:0;font-size:25px;letter-spacing:-.65px}.page-head p{margin:5px 0 0;color:var(--muted);font-size:12px}
.grid{display:grid;gap:16px}.grid.kpis{grid-template-columns:repeat(5,minmax(0,1fr));margin-bottom:16px}.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:17px;box-shadow:var(--shadow-sm)}.kpi-top{display:flex;justify-content:space-between;gap:10px}.kpi-label{font-size:11px;color:var(--muted);font-weight:800}.kpi-icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--sky);color:var(--blue)}.kpi-value{font-size:29px;font-weight:900;letter-spacing:-1px;margin-top:5px}.kpi-note{font-size:10px;color:var(--muted);margin-top:2px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);overflow:hidden}.card-pad{padding:18px}.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}.card-head h3{font-size:14px;margin:0}.card-head span{font-size:11px;color:var(--muted)}
.dash-grid{grid-template-columns:minmax(0,1.4fr) minmax(300px,.8fr)}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}
.status-bars{display:flex;flex-direction:column;gap:13px}.bar-row{display:grid;grid-template-columns:118px 1fr 36px;align-items:center;gap:9px;font-size:11px}.bar-track{height:9px;background:#EDF2F6;border-radius:999px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#0B4F8A,#4B9AC8);border-radius:999px}
.team-row{display:grid;grid-template-columns:minmax(190px,1fr) 1.3fr 80px;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid #EDF2F6}.team-row:last-child{border-bottom:0}.person{display:flex;align-items:center;gap:10px}.person b{font-size:12px}.person span{display:block;font-size:10px;color:var(--muted);margin-top:2px}.mini-progress{height:7px;border-radius:99px;background:#EDF2F6;overflow:hidden}.mini-progress i{display:block;height:100%;background:#2B7CB3;border-radius:99px}.team-metric{text-align:right;font-size:11px}.team-metric b{display:block;font-size:14px}
.feed{display:flex;flex-direction:column}.feed-item{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid #EDF2F6}.feed-item:last-child{border-bottom:0}.feed-ico{width:32px;height:32px;border-radius:10px;background:var(--sky2);display:grid;place-items:center;color:var(--blue)}.feed-item b{font-size:11px}.feed-item p{font-size:11px;color:var(--muted);margin:3px 0 0;line-height:1.45}.feed-time{font-size:9px;color:#94A3B8;margin-top:4px}
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.search{position:relative;min-width:260px;flex:1;max-width:420px}.search input{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px 10px 36px;background:#fff}.search:before{content:"⌕";position:absolute;left:13px;top:8px;color:#7D8C99;font-size:18px}.toolbar select{border:1px solid var(--line);border-radius:11px;padding:9px 10px;background:#fff;color:var(--ink)}
.task-table{width:100%;border-collapse:collapse}.task-table th{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#7A8A97;text-align:left;background:#F8FAFC;padding:11px 13px;border-bottom:1px solid var(--line)}.task-table td{padding:12px 13px;border-bottom:1px solid #EDF2F6;font-size:11px;vertical-align:middle}.task-table tr:hover td{background:#FBFDFF}.task-title{font-weight:850;font-size:12px}.task-desc{font-size:10px;color:var(--muted);margin-top:3px;max-width:390px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:850;white-space:nowrap}.pill.todo{background:#EEF2F6;color:#526474}.pill.progress{background:var(--sky);color:var(--blue)}.pill.wait{background:var(--amber-bg);color:var(--amber)}.pill.done{background:var(--green-bg);color:var(--green)}.pill.blocked,.pill.overdue{background:var(--red-bg);color:var(--red)}.pill.high{background:var(--red-bg);color:var(--red)}.pill.medium{background:var(--amber-bg);color:var(--amber)}.pill.low{background:var(--green-bg);color:var(--green)}
.progress-cell{min-width:110px}.progress-line{height:6px;background:#EDF2F6;border-radius:999px;overflow:hidden;margin-top:4px}.progress-line i{display:block;height:100%;background:var(--blue2)}.actions{display:flex;gap:5px}.link-btn{border:0;background:transparent;color:var(--blue);font-weight:800;font-size:11px;padding:4px}
.empty{padding:42px;text-align:center;color:var(--muted)}.empty .big{font-size:32px;margin-bottom:9px}
.board{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:12px;align-items:start;overflow-x:auto;padding-bottom:8px}.lane{background:#EAF0F5;border:1px solid #D7E2EA;border-radius:16px;min-height:420px;padding:10px}.lane-head{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 10px;font-size:11px;font-weight:900}.lane-count{background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 7px;color:var(--muted)}.task-card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:9px;box-shadow:0 3px 10px rgba(15,55,85,.05)}.task-card h4{font-size:12px;margin:0 0 5px}.task-card p{font-size:10px;color:var(--muted);line-height:1.45;margin:0}.task-card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px}.task-card-foot .avatar{width:27px;height:27px;border-radius:8px;font-size:9px}
.alert-list{display:flex;flex-direction:column;gap:9px}.alert{border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:12px;padding:11px 12px;background:#fff}.alert.danger{border-left-color:#E5484D;background:#FFFDFC}.alert.warning{border-left-color:#F59E0B}.alert b{font-size:11px}.alert p{font-size:10px;color:var(--muted);margin:4px 0 0;line-height:1.45}
.modal-backdrop{position:fixed;inset:0;background:rgba(8,28,43,.52);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}.modal{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.25)}.modal.wide{width:min(980px,100%)}.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head h3{margin:0;font-size:16px}.modal-close{border:0;background:#F2F5F7;width:32px;height:32px;border-radius:10px}.modal-body{padding:20px}.modal-foot{display:flex;justify-content:flex-end;gap:9px;padding:15px 20px;border-top:1px solid var(--line);background:#FBFCFD}
.notif-drawer{position:fixed;right:18px;top:76px;width:min(420px,calc(100vw - 36px));max-height:calc(100vh - 96px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 25px 70px rgba(15,55,85,.23);z-index:90}.notif-head{padding:15px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.notif-item{padding:13px 16px;border-bottom:1px solid #EDF2F6;display:grid;grid-template-columns:8px 1fr;gap:10px}.notif-item.unread{background:#F8FBFE}.notif-bullet{width:8px;height:8px;border-radius:50%;background:#CBD5E1;margin-top:4px}.notif-item.unread .notif-bullet{background:#2B7CB3}.notif-item b{font-size:11px}.notif-item p{font-size:10px;color:var(--muted);line-height:1.45;margin:4px 0}.notif-item time{font-size:9px;color:#94A3B8}
.toast-zone{position:fixed;right:20px;bottom:20px;z-index:200;display:flex;flex-direction:column;gap:9px}.toast{background:#16394F;color:#fff;border-radius:12px;padding:12px 14px;box-shadow:0 12px 30px rgba(0,0,0,.2);font-size:11px;max-width:360px}.toast.ok{background:#176B3A}.toast.err{background:#9D2D28}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px}.tab{border:0;background:transparent;padding:10px 12px;color:var(--muted);font-weight:800;border-bottom:2px solid transparent}.tab.active{color:var(--blue);border-color:var(--blue)}
.user-grid{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:13px}.user-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px}.user-card-top{display:flex;align-items:center;gap:10px}.user-card h4{margin:0;font-size:12px}.user-card p{font-size:10px;color:var(--muted);margin:3px 0 0}.user-card .meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.meta-box{background:#F7FAFC;border-radius:10px;padding:9px}.meta-box b{font-size:12px}.meta-box span{display:block;font-size:9px;color:var(--muted);margin-top:2px}
.audit-table{width:100%;border-collapse:collapse}.audit-table th,.audit-table td{padding:10px 12px;border-bottom:1px solid #EDF2F6;text-align:left;font-size:10px}.audit-table th{background:#F8FAFC;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.mobile-menu{display:none}
@media(max-width:1200px){.grid.kpis{grid-template-columns:repeat(3,1fr)}.user-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){
  body{overflow:auto}.login-page{grid-template-columns:1fr}.login-hero{display:none}.shell{grid-template-columns:1fr;grid-template-rows:var(--top) 1fr}.sidebar{position:fixed;left:-270px;width:260px;height:100vh;transition:.2s;box-shadow:var(--shadow);z-index:40}.sidebar.open{left:0}.topbar,.main{grid-column:1}.topbar{padding:0 14px}.mobile-menu{display:grid}.main{padding:16px}.grid.kpis{grid-template-columns:repeat(2,1fr)}.dash-grid,.two,.three{grid-template-columns:1fr}.user-grid{grid-template-columns:repeat(2,1fr)}.page-head{align-items:flex-start;flex-direction:column}
}
@media(max-width:580px){.grid.kpis{grid-template-columns:1fr 1fr}.kpi{padding:13px}.kpi-value{font-size:24px}.user-grid{grid-template-columns:1fr}.row{flex-direction:column}.search{min-width:100%;max-width:none}.top-sub,.sync-pill span.label{display:none}.main{padding:12px}.page-head h2{font-size:22px}}


/* V6 — Pessoas, avatares e ações */
.avatar-photo{padding:0!important;overflow:hidden;background:#fff!important}
.avatar-photo img{width:100%;height:100%;display:block;object-fit:cover;border-radius:inherit}
.status-select{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 9px;font-size:10px;font-weight:800;color:var(--ink);min-width:126px}
.status-select.is-overdue{border-color:#F0B7B2;background:#FFF9F8}
.user-card-actions{display:flex;gap:7px;margin-top:12px}
.user-card-actions .btn{flex:1}
.user-inactive{opacity:.67;background:#FAFBFC}
.photo-editor{display:flex;align-items:center;gap:16px;padding:14px;background:#F7FAFC;border:1px solid var(--line);border-radius:14px;margin-bottom:16px}
.photo-editor .avatar.lg{width:78px;height:78px;border-radius:20px;font-size:20px}
.record-hero{display:flex;align-items:center;gap:16px;padding:6px 0 18px;border-bottom:1px solid var(--line)}
.record-hero .avatar.lg{width:82px;height:82px;border-radius:22px;font-size:21px}
.record-hero h2{margin:0;font-size:22px;letter-spacing:-.5px}
.record-hero p{margin:4px 0 8px;color:var(--muted)}
.record-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.record-kpis>div{padding:12px;border-radius:12px;background:#F7FAFC;border:1px solid var(--line)}
.record-kpis b{display:block;font-size:20px}.record-kpis span{font-size:9px;color:var(--muted)}
.record-section{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}
.record-section h4{margin:0 0 10px;font-size:12px}
.record-line{display:flex;justify-content:space-between;gap:16px;padding:7px 0;border-bottom:1px solid #EDF2F6;font-size:10px}
.record-line:last-child{border-bottom:0}.record-line span{color:var(--muted)}.record-line b{text-align:right;max-width:62%;word-break:break-word}
.record-task{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #EDF2F6}
.record-task:last-child{border-bottom:0}.record-task b{font-size:11px}.record-task span{display:block;font-size:9px;color:var(--muted);margin-top:2px}
@media(max-width:580px){.record-kpis{grid-template-columns:1fr 1fr}.record-line{flex-direction:column;gap:3px}.record-line b{text-align:left;max-width:100%}}

/* V6.1 — Solicitações de férias e horas extras */
.request-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px}
.request-summary>div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 15px}
.request-summary b{display:block;font-size:22px}.request-summary span{font-size:10px;color:var(--muted)}
.request-type{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:850;white-space:nowrap}
.request-special{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;background:#F9FBFD}
.request-special-title{font-size:12px;font-weight:900;margin-bottom:12px}
.vacation-special{background:#F8FCFF;border-color:#CFE3F1}.overtime-special{background:#FFFBF4;border-color:#F2D8A5}
.vacation-list{display:flex;flex-direction:column;gap:9px}
.vacation-notice{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff}
.vacation-notice.pending{border-left:4px solid #F59E0B}.vacation-notice.approved{border-left:4px solid #22A06B}
.vacation-icon{width:34px;height:34px;border-radius:10px;background:#F4F8FB;display:grid;place-items:center}
.vacation-body b{font-size:11px}.vacation-body p{font-size:10px;color:var(--muted);margin:3px 0 6px}
.vacation-actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:700px){.request-summary{grid-template-columns:1fr}.vacation-notice{grid-template-columns:36px 1fr}.vacation-actions{grid-column:1/3;justify-content:flex-start}}

/* V6.2 — seletor explícito de solicitações e trava de gravação */
.request-kind-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:7px}
.request-kind{border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 12px;text-align:left;color:var(--ink);display:grid;grid-template-columns:32px 1fr;column-gap:8px;align-items:center;transition:.16s}
.request-kind>span{grid-row:1/3;font-size:22px}.request-kind b{font-size:12px}.request-kind small{font-size:9px;color:var(--muted);margin-top:2px}
.request-kind:hover{border-color:#9CC3DF;background:#F8FBFE}.request-kind.active{border-color:var(--blue2);background:var(--sky);box-shadow:0 0 0 3px rgba(23,105,166,.08)}

button:disabled{opacity:.55;cursor:not-allowed;transform:none!important}
@media(max-width:620px){.request-kind-grid{grid-template-columns:1fr}}

<body>
<script>
const APP_CONFIG = {
  VERSION: '6.2.0',
  DEFAULT_API_URL: "https://script.google.com/macros/s/AKfycbzXEFTcaUYvYhs8E1m6VRUUUire4VwxB12wQQ3-CYho8mtn7jWMBWduFWTHZK5PVeJv/exec",
  API_STORAGE_KEY: 'crisdu_api_url_v5',
  TOKEN_KEY: 'crisdu_api_token_v5',
  POLL_MS: 7000,
  BUILD_ID: '20260901-1333'
};

const STATIC_USERS = {
  debora:{role:'rh',name:'Débora',initials:'DE',title:'Gerência',team:'Todos os setores',manager:''},
  bruna:{role:'gestor',name:'Bruna',initials:'BR',title:'Coordenação · Tesouraria e Contas a Pagar',team:'Tesouraria e Contas a Pagar',manager:''},
  carolini:{role:'gestor',name:'Carolini',initials:'CA',title:'Coordenação de Contas a Receber',team:'Contas a Receber',manager:''},
  neidi:{role:'gestor',name:'Neidi Becker',initials:'NE',title:'Coordenação · Financeiro Romance',team:'Financeiro Romance',manager:''},
  leticia:{role:'colab',name:'Letícia',initials:'LM',title:'Analista de Tesouraria',team:'Tesouraria',manager:'bruna'},
  franciele:{role:'colab',name:'Franciele',initials:'FP',title:'Analista de Tesouraria',team:'Tesouraria',manager:'bruna'},
  estefani:{role:'colab',name:'Estéfani',initials:'EO',title:'Assistente Pleno · Contas a Pagar',team:'Contas a Pagar',manager:'bruna'},
  nadia:{role:'colab',name:'Nádia de Vargas Beck',initials:'NB',title:'Especialista Financeira',team:'Tesouraria',manager:'bruna'}
};

const TEAM_MAP = {bruna:['leticia','franciele','estefani','nadia'],carolini:[],neidi:[]};

const state = {
  session:null, users:{...STATIC_USERS}, tasks:[], requests:[], feedbacks:[], pdis:[], events:[], notifications:[], audit:[],
  version:0, page:'dashboard', taskView:'table', taskFilter:'all', peopleFilter:'active', search:'', poll:null, syncing:false, savingTask:false, serverState:'idle'
};

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const uid = () => 'id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);
const nowIso = () => new Date().toISOString();
const fmtDate = v => !v ? '—' : new Date(v.length===10?v+'T12:00:00':v).toLocaleDateString('pt-BR');
const fmtDateTime = v => !v ? '—' : new Date(v).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
const clamp = (n,a,b)=>Math.min(b,Math.max(a,Number(n)||0));

function apiUrl(){ return APP_CONFIG.DEFAULT_API_URL; }

try{
  ['crisdu_api_url','crisdu_api_url_v5','crisdu_api_url_v6','crisdu_api_url_v61','crisdu_api_url_v62'].forEach(k=>localStorage.removeItem(k));
}catch(e){}

function token(){ return sessionStorage.getItem(APP_CONFIG.TOKEN_KEY)||''; }

function toast(msg,type='') {
  const z = $('#toast-zone'); if(!z) return;
  const el=document.createElement('div'); el.className='toast '+type; el.textContent=msg; z.appendChild(el);
  setTimeout(()=>el.remove(),4200);
}

function setServerState(kind,text) {
  state.serverState=kind;
  const el=$('#sync-pill'); if(!el)return;
  el.className='sync-pill '+kind;
  el.innerHTML=`<span class="status-dot ${kind==='online'?'online':kind==='error'?'error':''}"></span><span class="label">${esc(text||'Servidor')}</span>`;
}

async function api(action,data={},silent=false) {
  if(state.syncing && action==='changes') return null;
  if(!silent)setServerState('syncing','Sincronizando…');
  const controller=new AbortController(); const t=setTimeout(()=>controller.abort(),25000);
  try {
    const r=await fetch(apiUrl(),{method:'POST',redirect:'follow',cache:'no-store',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:token(),...data}),signal:controller.signal});
    const raw=await r.text(); let j;
    try{j=JSON.parse(raw)}catch(e){throw new Error('Servidor respondeu em formato inválido. Publique o Apps Script como Web App e use a URL /exec.');}
    if(!j.ok) throw new Error(j.error||j.erro||'Erro no servidor.');
    setServerState('online','Servidor online'); return j;
  } catch(e) {
    if(e.name==='AbortError') e=new Error('Tempo de resposta do servidor excedido.');
    setServerState('error','Falha no servidor');
    if(!silent)toast(e.message,'err');
    throw e;
  } finally { clearTimeout(t); }
}

async function testServer() {
  const err=$('#login-error'); if(err)err.textContent='';
  try {
    const j=await api('health',{},true);
    setServerState('online',j.backend||'Servidor online');
    toast('Servidor conectado.','ok');
    return true;
  } catch(e) {
    if(err)err.textContent=e.message;
    return false;
  }
}

function currentUser(){ return state.session?.userKey||''; }
function currentRole(){ return state.session?.role||''; }
function isLeader(){ return ['rh','gestor'].includes(currentRole()); }
function user(key){ return state.users[key]||{name:key||'—',initials:String(key||'?').slice(0,2).toUpperCase(),role:'colab',title:'',team:'',manager:'',active:true,photoUrl:'',email:'',phone:'',company:'',unit:'',costCenter:'',contractType:'',workModel:'',birthDate:'',hireDate:'',cpf:'',notes:''}; }
function avatar(key,lg=false){
  const u=user(key),cls=`avatar ${lg?'lg':''}`;
  if(u.photoUrl) return `<span class="${cls} avatar-photo"><img src="${esc(u.photoUrl)}" alt="${esc(u.name)}" onerror="this.parentElement.classList.remove('avatar-photo');this.parentElement.innerHTML='${esc(u.initials||u.name.slice(0,2).toUpperCase())}'"></span>`;
  return `<span class="${cls}">${esc(u.initials||u.name.slice(0,2).toUpperCase())}</span>`;
}
function visibleKeys() {
  if(currentRole()==='rh') return Object.keys(state.users);
  if(currentRole()==='gestor') return [currentUser(),...(TEAM_MAP[currentUser()]||[]),...Object.keys(state.users).filter(k=>state.users[k].manager===currentUser()&&state.users[k].active!==false)].filter((v,i,a)=>a.indexOf(v)===i);
  return [currentUser()];
}
function teamKeys(){ return currentRole()==='rh'?Object.keys(state.users).filter(k=>state.users[k].role==='colab'):visibleKeys().filter(k=>k!==currentUser()&&state.users[k]?.role==='colab'); }
function canSeeOwner(owner){ return visibleKeys().includes(owner); }

function statusClass(s){ return {'Não iniciada':'todo','Em andamento':'progress','Aguardando':'wait','Concluída':'done','Bloqueada':'blocked'}[s]||'todo'; }
function priorityClass(p){ return {'Alta':'high','Média':'medium','Baixa':'low'}[p]||'low'; }
function requestStatusClass(s){
  return {'Pendente de aprovação':'wait','Em análise':'progress','Aprovada':'done','Rejeitada':'blocked','Cancelada':'todo','Concluída':'done'}[s]||statusClass(s);
}
function daysBetweenInclusive(a,b){
  if(!a||!b)return 0;
  const x=new Date(a+'T12:00:00'),y=new Date(b+'T12:00:00');
  return Math.max(0,Math.round((y-x)/86400000)+1);
}
function requestTypeIcon(type){
  return type==='Férias'?'🏖':type==='Horas extras'?'⏱':'↗';
}
function vacationRequests(){
  return state.requests.filter(r=>r.type==='Férias' && (currentRole()==='rh'||r.requester===currentUser()||r.recipient===currentUser()||canSeeOwner(r.requester)));
}

function isOverdue(t){ return t.status!=='Concluída'&&t.dueDate&&new Date(t.dueDate+'T23:59:59')<new Date(); }
function dueSoon(t){ if(!t.dueDate||t.status==='Concluída')return false; const d=(new Date(t.dueDate+'T23:59:59')-new Date())/86400000; return d>=0&&d<=3; }
function pct(t){ return clamp(t.progress,0,100); }

function navItems() {
  const base=[
    ['dashboard','▦','Painel'],
    ['tasks','✓','Atividades'],
    ['requests','↗','Solicitações'],
    ['feedbacks','◌','Feedbacks & PDI']
  ];
  if(isLeader()) base.splice(2,0,['team','👥','Equipe']);
  if(isLeader()) base.push(['people','♙','Pessoas']);
  if(isLeader()) base.push(['audit','≡','Auditoria']);
  base.push(['settings','⚙','Configurações']);
  return base;
}

function renderShell() {
  document.body.innerHTML=`<div id="app">
    <div class="shell">
      <aside class="sidebar" id="sidebar">
        <div class="side-brand"><div class="logo-mark">RH</div><div><b>Gestão de Pessoas</b><span>Financeiro Central</span></div></div>
        <nav class="nav" id="nav"></nav>
        <div class="side-footer">
          <div class="mini-user">${avatar(currentUser())}<div><b>${esc(user(currentUser()).name)}</b><span>${esc(user(currentUser()).title||currentRole())}</span></div></div>
          <button class="btn btn-outline btn-sm" style="width:100%;margin-top:8px" onclick="logout()">Sair</button>
        </div>
      </aside>
      <header class="topbar">
        <button class="icon-btn mobile-menu" onclick="toggleMobileMenu()">☰</button>
        <div><div class="top-title" id="top-title">Painel</div><div class="top-sub" id="top-sub">Visão integrada da equipe</div></div>
        <div class="top-spacer"></div>
        <div class="sync-pill" id="sync-pill"><span class="status-dot"></span><span class="label">Servidor</span></div>
        <button class="icon-btn" title="Notificações" onclick="toggleNotifications()">🔔<span class="badge-count hidden" id="notif-count">0</span></button>
      </header>
      <main class="main"><div class="page" id="page"></div></main>
    </div>
    <div id="notif-drawer"></div><div id="modal-root"></div><div class="toast-zone" id="toast-zone"></div>
  </div>`;
  renderNav(); updateNotifBadge(); renderPage(); startPolling();
}

function renderNav() {
  $('#nav').innerHTML=navItems().map(([id,ico,label])=>`<button class="${state.page===id?'active':''}" onclick="go('${id}')"><span class="nav-ico">${ico}</span>${label}</button>`).join('');
}
function go(page){ state.page=page; renderNav(); renderPage(); toggleMobileMenu(false); }
function toggleMobileMenu(force){ const s=$('#sidebar'); if(!s)return; force===false?s.classList.remove('open'):s.classList.toggle('open'); }

function pageHead(title,sub,action='') {
  return `<div class="page-head"><div><h2>${esc(title)}</h2><p>${esc(sub)}</p></div>${action}</div>`;
}

function scopedTasks(){ return state.tasks.filter(t=>canSeeOwner(t.owner)||t.createdBy===currentUser()); }

function dashboardData() {
  const tasks=scopedTasks(), open=tasks.filter(t=>t.status!=='Concluída'), done=tasks.filter(t=>t.status==='Concluída');
  return {
    tasks, open, done,
    progress:open.filter(t=>t.status==='Em andamento'),
    overdue:open.filter(isOverdue),
    blocked:open.filter(t=>t.status==='Bloqueada'),
    soon:open.filter(dueSoon)
  };
}

function renderDashboard() {
  const d=dashboardData();
  const team = isLeader()?teamKeys():[currentUser()];
  const kpis=[
    ['Atividades abertas',d.open.length,'Carteira atual','✓'],
    ['Em andamento',d.progress.length,'Execução ativa','↻'],
    ['Vencidas',d.overdue.length,'Exigem ação','!'],
    ['Bloqueadas',d.blocked.length,'Com impedimentos','⛔'],
    ['Concluídas',d.done.length,'Histórico visível','✓']
  ];
  const title=isLeader()?'Painel da Gestão':'Meu Painel';
  const sub=isLeader()?'Acompanhamento do status das atividades do time em tempo quase real.':'Suas atividades, prazos, pendências e notificações em um único lugar.';
  $('#top-title').textContent=title; $('#top-sub').textContent=sub;
  $('#page').innerHTML=pageHead(title,sub,`<button class="btn btn-primary" onclick="openTaskModal()">+ Nova atividade</button>`) +
    `<div class="grid kpis">${kpis.map((k,i)=>`<div class="kpi"><div class="kpi-top"><div><div class="kpi-label">${k[0]}</div><div class="kpi-value">${k[1]}</div><div class="kpi-note">${k[2]}</div></div><div class="kpi-icon">${k[3]}</div></div></div>`).join('')}</div>
    <div class="grid dash-grid">
      <div class="grid" style="gap:16px">
        <div class="card"><div class="card-head"><div><h3>${isLeader()?'Status das atividades do time':'Status das minhas atividades'}</h3><span>Distribuição por etapa</span></div><button class="link-btn" onclick="go('tasks')">Ver atividades</button></div><div class="card-pad">${renderStatusBars(d.tasks)}</div></div>
        ${isLeader()?`<div class="card"><div class="card-head"><div><h3>Visão por pessoa</h3><span>Carga, avanço e pontos de atenção</span></div></div><div class="card-pad">${renderTeamSummary(team)}</div></div>`:''}
        <div class="card"><div class="card-head"><div><h3>Movimentações recentes</h3><span>Criações, alterações de status e registros</span></div></div><div class="card-pad">${renderFeed(state.events.slice(0,12))}</div></div>
      </div>
      <div class="grid" style="gap:16px">
        <div class="card"><div class="card-head"><div><h3>Alertas gerenciais</h3><span>O que precisa de atenção agora</span></div></div><div class="card-pad">${renderAlerts(d)}</div></div>
        ${isLeader()?`<div class="card"><div class="card-head"><div><h3>Avisos de férias</h3><span>Pedidos pendentes e férias programadas</span></div><button class="link-btn" onclick="go('requests')">Ver solicitações</button></div><div class="card-pad">${renderVacationNotices()}</div></div>`:''}
        <div class="card"><div class="card-head"><div><h3>Próximos prazos</h3><span>Até 7 dias</span></div></div><div class="card-pad">${renderUpcoming(d.open)}</div></div>
      </div>
    </div>`;
}

function renderStatusBars(tasks) {
  const statuses=['Não iniciada','Em andamento','Aguardando','Bloqueada','Concluída'];
  const total=Math.max(tasks.length,1);
  return `<div class="status-bars">${statuses.map(s=>{const n=tasks.filter(t=>t.status===s).length;return `<div class="bar-row"><span>${esc(s)}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.round(n/total*100)}%"></div></div><b>${n}</b></div>`}).join('')}</div>`;
}
function renderTeamSummary(keys) {
  if(!keys.length)return `<div class="empty"><div class="big">👥</div>Nenhum colaborador vinculado a esta gestão.</div>`;
  return keys.map(k=>{const ts=state.tasks.filter(t=>t.owner===k), open=ts.filter(t=>t.status!=='Concluída'), ov=open.filter(isOverdue).length, bl=open.filter(t=>t.status==='Bloqueada').length; const avg=ts.length?Math.round(ts.reduce((a,t)=>a+pct(t),0)/ts.length):0; return `<div class="team-row"><div class="person">${avatar(k)}<div><b>${esc(user(k).name)}</b><span>${esc(user(k).title||user(k).team)}</span></div></div><div><div class="small muted">${open.length} abertas · ${ov} vencidas · ${bl} bloqueadas</div><div class="mini-progress"><i style="width:${avg}%"></i></div></div><div class="team-metric"><b>${avg}%</b><span class="muted">avanço</span></div></div>`}).join('');
}
function renderFeed(events) {
  if(!events.length)return `<div class="empty">Nenhuma movimentação registrada ainda.</div>`;
  return `<div class="feed">${events.map(e=>`<div class="feed-item"><div class="feed-ico">${(!e.icon||String(e.icon).startsWith('#ERROR'))?'＋':e.icon}</div><div><b>${esc(e.title||e.type||'Atualização')}</b><p>${esc(e.detail||'')}</p><div class="feed-time">${esc(user(e.actor).name)} · ${fmtDateTime(e.createdAt)}</div></div></div>`).join('')}</div>`;
}
function renderAlerts(d) {
  const arr=[];
  d.overdue.slice(0,4).forEach(t=>arr.push(`<div class="alert danger"><b>Atividade vencida · ${esc(user(t.owner).name)}</b><p>${esc(t.title)} · prazo ${fmtDate(t.dueDate)}</p></div>`));
  d.blocked.slice(0,4).forEach(t=>arr.push(`<div class="alert danger"><b>Bloqueio informado · ${esc(user(t.owner).name)}</b><p>${esc(t.title)}${t.blocker?' · '+esc(t.blocker):''}</p></div>`));
  d.soon.slice(0,4).forEach(t=>arr.push(`<div class="alert warning"><b>Prazo próximo · ${esc(user(t.owner).name)}</b><p>${esc(t.title)} · ${fmtDate(t.dueDate)}</p></div>`));
  return arr.length?`<div class="alert-list">${arr.slice(0,8).join('')}</div>`:`<div class="empty">Nenhum alerta crítico no momento.</div>`;
}

function renderVacationNotices(){
  const rows=vacationRequests().filter(r=>['Pendente de aprovação','Em análise','Aprovada'].includes(r.status))
    .sort((a,b)=>String(a.startDate||'9999').localeCompare(String(b.startDate||'9999')));
  if(!rows.length)return `<div class="empty">Nenhum aviso de férias no momento.</div>`;
  return `<div class="vacation-list">${rows.slice(0,8).map(r=>{
    const pending=['Pendente de aprovação','Em análise'].includes(r.status);
    const days=r.days||daysBetweenInclusive(r.startDate,r.endDate);
    return `<div class="vacation-notice ${pending?'pending':'approved'}">
      <div class="vacation-icon">${pending?'⏳':'🏖'}</div>
      <div class="vacation-body"><b>${esc(user(r.requester).name)}</b>
      <p>${fmtDate(r.startDate)} a ${fmtDate(r.endDate)} · ${days} dia${days===1?'':'s'}</p>
      <span class="pill ${requestStatusClass(r.status)}">${esc(r.status)}</span></div>
      ${pending&&isLeader()?`<div class="vacation-actions"><button class="btn btn-soft btn-sm" onclick="decideRequest('${r.id}','Aprovada')">Aprovar</button><button class="btn btn-danger btn-sm" onclick="decideRequest('${r.id}','Rejeitada')">Rejeitar</button></div>`:''}
    </div>`;
  }).join('')}</div>`;
}

function renderUpcoming(tasks) {
  const rows=tasks.filter(t=>t.dueDate).sort((a,b)=>String(a.dueDate).localeCompare(String(b.dueDate))).filter(t=>{const d=(new Date(t.dueDate+'T23:59:59')-new Date())/86400000;return d>=0&&d<=7}).slice(0,8);
  if(!rows.length)return `<div class="empty">Sem prazos nos próximos 7 dias.</div>`;
  return rows.map(t=>`<div class="feed-item"><div class="feed-ico">📅</div><div><b>${esc(t.title)}</b><p>${esc(user(t.owner).name)} · <span class="pill ${priorityClass(t.priority)}">${esc(t.priority)}</span></p><div class="feed-time">${fmtDate(t.dueDate)}</div></div></div>`).join('');
}

function renderTasks() {
  $('#top-title').textContent='Atividades'; $('#top-sub').textContent='Criação, execução, prazos e status';
  const all=scopedTasks();
  const q=state.search.toLowerCase();
  const tasks=all.filter(t=>{
    if(state.taskFilter!=='all'&&t.status!==state.taskFilter)return false;
    return !q||[t.title,t.description,user(t.owner).name,t.category,t.status].join(' ').toLowerCase().includes(q);
  });
  $('#page').innerHTML=pageHead('Atividades','Toda alteração é registrada no servidor e refletida no painel da gestão.',`<button class="btn btn-primary" onclick="openTaskModal()">+ Nova atividade</button>`) +
  `<div class="toolbar"><div class="search"><input placeholder="Buscar atividade, responsável ou categoria..." value="${esc(state.search)}" oninput="state.search=this.value;renderTasks()"></div>
  <select onchange="state.taskFilter=this.value;renderTasks()"><option value="all">Todos os status</option>${['Não iniciada','Em andamento','Aguardando','Bloqueada','Concluída'].map(s=>`<option ${state.taskFilter===s?'selected':''}>${s}</option>`).join('')}</select>
  <button class="btn btn-outline btn-sm" onclick="state.taskView=state.taskView==='table'?'board':'table';renderTasks()">${state.taskView==='table'?'Quadro':'Tabela'}</button></div>
  <div class="card">${state.taskView==='table'?renderTaskTable(tasks):renderTaskBoard(tasks)}</div>`;
}
function renderTaskTable(tasks) {
  if(!tasks.length)return `<div class="empty"><div class="big">✓</div>Nenhuma atividade encontrada.</div>`;
  return `<div style="overflow:auto"><table class="task-table"><thead><tr><th>Atividade</th><th>Responsável</th><th>Status</th><th>Prioridade</th><th>Prazo</th><th>Progresso</th><th>Ações</th></tr></thead><tbody>${tasks.map(t=>`<tr>
    <td><div class="task-title">${esc(t.title)}</div><div class="task-desc">${esc(t.description||t.category||'')}</div></td>
    <td><div class="person">${avatar(t.owner)}<div><b>${esc(user(t.owner).name)}</b><span>${esc(user(t.owner).team)}</span></div></div></td>
    <td><select class="status-select ${isOverdue(t)?'is-overdue':''}" onchange="quickTaskStatus('${t.id}',this.value)" title="Alterar status">${['Não iniciada','Em andamento','Aguardando','Bloqueada','Concluída'].map(s=>`<option ${t.status===s?'selected':''}>${s}</option>`).join('')}</select>${isOverdue(t)?'<div class="small" style="color:var(--red);margin-top:4px">Prazo vencido</div>':''}</td>
    <td><span class="pill ${priorityClass(t.priority)}">${esc(t.priority)}</span></td><td>${fmtDate(t.dueDate)}</td>
    <td class="progress-cell"><b>${pct(t)}%</b><div class="progress-line"><i style="width:${pct(t)}%"></i></div></td>

  let keys=currentRole()==='rh'?Object.keys(state.users):visibleKeys();
  if(currentRole()!=='rh') keys=keys.filter(k=>state.users[k]?.active!==false);
  if(currentRole()==='rh'&&state.peopleFilter==='active') keys=keys.filter(k=>state.users[k]?.active!==false);
  if(currentRole()==='rh'&&state.peopleFilter==='inactive') keys=keys.filter(k=>state.users[k]?.active===false);
  return keys.sort((a,b)=>String(user(a).name).localeCompare(String(user(b).name),'pt-BR'));
}

async function prepareUserPhoto(file){
  if(!file)return;
  if(!file.type.startsWith('image/'))return toast('Selecione uma imagem válida.','err');
  if(file.size>8*1024*1024)return toast('A foto original deve ter no máximo 8 MB.','err');
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const size=512,canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');canvas.width=size;canvas.height=size;
      const scale=Math.max(size/img.width,size/img.height),w=img.width*scale,h=img.height*scale;
      ctx.drawImage(img,(size-w)/2,(size-h)/2,w,h);
      __userPhotoData=canvas.toDataURL('image/jpeg',.82);__userPhotoRemove=false;
      $('#u-photo-preview').innerHTML=`<span class="avatar lg avatar-photo"><img src="${__userPhotoData}" alt="Prévia"></span>`;
    };img.src=reader.result;
  };reader.readAsDataURL(file);
}
function removeUserPhoto(){__userPhotoData='';__userPhotoRemove=true;$('#u-photo-preview').innerHTML='<span class="avatar lg">+</span>';}
function collectUserForm(){
  return {name:$('#u-name').value.trim(),login:$('#u-login').value.trim().toLowerCase(),role:$('#u-role').value,manager:$('#u-manager').value,active:$('#u-active').value==='true',

    birthDate:$('#u-birth').value,hireDate:$('#u-hire').value,company:$('#u-company').value.trim(),unit:$('#u-unit').value.trim(),costCenter:$('#u-cc').value.trim(),
    contractType:$('#u-contract').value,workModel:$('#u-work').value,notes:$('#u-notes').value.trim(),photoData:__userPhotoData,removePhoto:__userPhotoRemove};
}
async function saveUser(key=''){
  const payload=collectUserForm();if(!payload.name||!payload.login)return toast('Informe nome e login.','err');
  try{
    const j=await api(key?'updateUser':'createUser',key?{userKey:key,user:payload}:{user:payload});
    applySnapshot(j.snapshot);closeModal();
    if(j.credentials)showSecret('Usuário criado',`Login: ${j.credentials.login}\nSenha temporária: ${j.credentials.password}\n\nEnvie por canal seguro. A troca será obrigatória no primeiro acesso.`);
    else toast('Cadastro atualizado.','ok');
    renderPage();
  }catch(e){}
}
async function deactivateUser(key){
  const u=user(key);if(u.active===false)return closeModal();
  if(!confirm('Inativar '+u.name+'? O histórico será preservado e o login será bloqueado.'))return;
  try{const j=await api('deleteUser',{userKey:key});applySnapshot(j.snapshot);closeModal();toast('Cadastro inativado com histórico preservado.','ok');renderPage();}catch(e){}
}
async function resetUserPassword(key) {
  if(currentRole()!=='rh')return toast('Somente o RH pode redefinir senhas.','err');

function renderPage() {
  if(!state.session)return;
  if(state.page==='dashboard')renderDashboard();
  else if(state.page==='tasks')renderTasks();
  else if(state.page==='team')renderTeam();
  else if(state.page==='requests')renderRequests();
  else if(state.page==='feedbacks')renderFeedbacks();
  else if(state.page==='people')renderPeople();
  else if(state.page==='audit')renderAudit();

}

async function login() {
  const username=$('#login-user').value.trim(),password=$('#login-pass').value; const err=$('#login-error'); err.textContent='';
  if(!username||!password){err.textContent='Informe usuário e senha.';return;}
  try {
    const j=await api('login',{username,password},true);
    sessionStorage.setItem(APP_CONFIG.TOKEN_KEY,j.token);
    state.session={userKey:j.userKey,role:j.role,forceReset:!!j.forceReset};
    await bootstrap();
    renderShell();
    if(j.forceReset)setTimeout(()=>openChangePassword(true),250);
  } catch(e) { err.textContent=e.message; }
}
async function bootstrap() {
  const j=await api('bootstrap',{},true); applySnapshot(j.snapshot); state.session={...state.session,...j.session};
}

function applySnapshot(s) {
  if(!s)return;
  const oldUnread=new Set(state.notifications.filter(n=>!n.read).map(n=>n.id));
  if(s.users){state.users=Object.keys(s.users).length?s.users:{...STATIC_USERS};}
  state.tasks=s.tasks||[]; state.requests=s.requests||[]; state.feedbacks=s.feedbacks||[]; state.pdis=s.pdis||[]; state.events=(s.events||[]).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));
  state.notifications=(s.notifications||[]).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt))); state.audit=(s.audit||[]).sort((a,b)=>String(b.createdAt||b.date).localeCompare(String(a.createdAt||a.date)));
  state.version=Number(s.version||state.version||0);
  const fresh=state.notifications.filter(n=>!n.read&&!oldUnread.has(n.id));
  if(fresh.length&&oldUnread.size)toast(fresh[0].title+': '+fresh[0].message);
  updateNotifBadge();
}
async function pollNow(force=false) {
  if(!state.session||state.syncing)return;
  state.syncing=true;
  try{const j=await api('changes',{version:force?0:state.version},true);if(j&&j.changed&&j.snapshot){applySnapshot(j.snapshot);renderPage();}}catch(e){}finally{state.syncing=false;}
}
function startPolling() {
  if(state.poll)clearInterval(state.poll);
  state.poll=setInterval(()=>pollNow(false),APP_CONFIG.POLL_MS);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)pollNow(false)});
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();const d=$('#notif-drawer');if(d)d.innerHTML='';}});

renderLogin();

</script>
</body>
</html>
